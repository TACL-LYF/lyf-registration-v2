[build]
  command = "cd website && yarn run build"

[build.environment]
  NODE_VERSION = "22"

# Content Security Policy and security headers
[[headers]]
  for = "/*"
  [headers.values]
    # CSP: allow self, Stripe, Firebase, Google Fonts, Sentry, Google Analytics
    Content-Security-Policy-Report-Only = "default-src 'self'; script-src 'self' 'unsafe-eval' 'unsafe-inline' https://apis.google.com https://js.stripe.com https://*.sentry.io https://www.googletagmanager.com https://www.google-analytics.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https: blob:; connect-src 'self' https://*.stripe.com https://*.googleapis.com https://*.google.com https://*.firebaseio.com https://*.firebaseapp.com https://*.cloudfunctions.net https://firestore.googleapis.com https://securetoken.googleapis.com https://identitytoolkit.googleapis.com https://*.sentry.io https://www.google-analytics.com https://stats.g.doubleclick.net wss://*.firebaseio.com; frame-src 'self' https://js.stripe.com https://hooks.stripe.com https://accounts.google.com https://lyf-registration.firebaseapp.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'; report-uri https://o4510758163251200.ingest.us.sentry.io/api/4510758330499072/security/?sentry_key=3414e48dc3888601e6615b647e04b037;"
    # Harden against XSS and clickjacking
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
